name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Check (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    env:
      # Typecheck, tests and the build never start Electron; skip the large binary download.
      ELECTRON_SKIP_BINARY_DOWNLOAD: '1'
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build

  smoke:
    name: UI smoke test (${{ matrix.os }})
    # Starts the real UI in Electron with demo sessions (scripts/screenshots): clicks Allow, answers a question,
    # opens every dialog and checks that Esc closes it. Fails on any error; the rendered images are attached.
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Run (Windows, macOS)
        if: runner.os != 'Linux'
        run: npm run screenshots
      - name: Run (Linux, virtual display)
        if: runner.os == 'Linux'
        # GitHub's Linux runners have no display, and Chromium's sandbox helper is not set up there.
        env:
          ELECTRON_DISABLE_SANDBOX: '1'
        run: xvfb-run -a npm run screenshots
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: ui-screenshots-${{ runner.os }}
          path: docs/images/
          retention-days: 14

  package:
    name: npm package (${{ matrix.os }})
    # Installs the packed npm package like a user would (in a temporary prefix) and runs its command:
    # --version (the bin script) and --uninstall (Electron starts the packaged main process and edits settings).
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
        env:
          ELECTRON_SKIP_BINARY_DOWNLOAD: '1'
      - run: npm pack
      - name: Install into a temporary prefix
        run: npm install -g --prefix "$RUNNER_TEMP/npm" ./agenttiles-*.tgz
      - name: agenttiles --version
        run: |
          bin="$RUNNER_TEMP/npm/bin"; [ "$RUNNER_OS" = Windows ] && bin="$RUNNER_TEMP/npm"
          test "$("$bin/agenttiles" --version)" = "$(node -p "require('./package.json').version")"
      - name: agenttiles --uninstall
        env:
          CLAUDE_CONFIG_DIR: ${{ runner.temp }}/claude
        run: |
          mkdir -p "$CLAUDE_CONFIG_DIR" && echo '{}' > "$CLAUDE_CONFIG_DIR/settings.json"
          bin="$RUNNER_TEMP/npm/bin"; [ "$RUNNER_OS" = Windows ] && bin="$RUNNER_TEMP/npm"
          if [ "$RUNNER_OS" = Linux ]; then xvfb-run -a "$bin/agenttiles" --uninstall; else "$bin/agenttiles" --uninstall; fi
