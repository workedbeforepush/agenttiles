name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Check (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    env:
      # Typecheck, tests and the build never start Electron; skip the large binary download.
      ELECTRON_SKIP_BINARY_DOWNLOAD: '1'
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build

  smoke:
    name: UI smoke test (ubuntu-latest)
    # Starts the real UI in Electron with demo sessions (scripts/screenshots): clicks Allow, answers a question,
    # opens every dialog and checks that Esc closes it. Fails on any error; the rendered images are attached.
    # Linux only: on the Windows runner image the first offscreen capture fails at random with UnknownVizError.
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Run (virtual display)
        # GitHub's Linux runners have no display, and Chromium's sandbox helper is not set up there.
        env:
          ELECTRON_DISABLE_SANDBOX: '1'
        run: xvfb-run -a npm run screenshots
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: ui-screenshots-${{ runner.os }}
          path: docs/images/
          retention-days: 14

  package:
    name: npm package (${{ matrix.os }})
    # Installs the packed npm package like a user would (in a temporary prefix), checks that every part of the app
    # is in it, and runs its command: --version and --uninstall (which edits a test settings.json).
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
        env:
          ELECTRON_SKIP_BINARY_DOWNLOAD: '1'
      - run: npm pack
      - name: Install into a temporary prefix
        run: npm install -g --prefix "$RUNNER_TEMP/npm" ./agenttiles-*.tgz
      - name: Package contains the app
        run: |
          pkg="$RUNNER_TEMP/npm/lib/node_modules/agenttiles"; [ "$RUNNER_OS" = Windows ] && pkg="$RUNNER_TEMP/npm/node_modules/agenttiles"
          for f in out/main/index.js out/preload/index.js out/renderer/index.html out/hook/agenttiles-hook.js out/cli/uninstall.js resources/icon.ico resources/icon.png; do
            test -f "$pkg/$f" || { echo "missing $f"; exit 1; }
          done
      - name: agenttiles --version
        run: |
          bin="$RUNNER_TEMP/npm/bin"; [ "$RUNNER_OS" = Windows ] && bin="$RUNNER_TEMP/npm"
          test "$("$bin/agenttiles" --version)" = "$(node -p "require('./package.json').version")"
      - name: agenttiles --uninstall
        env:
          CLAUDE_CONFIG_DIR: ${{ runner.temp }}/claude
        run: |
          mkdir -p "$CLAUDE_CONFIG_DIR" && echo '{}' > "$CLAUDE_CONFIG_DIR/settings.json"
          bin="$RUNNER_TEMP/npm/bin"; [ "$RUNNER_OS" = Windows ] && bin="$RUNNER_TEMP/npm"
          "$bin/agenttiles" --uninstall

  macos:
    name: macOS (not required)
    # GitHub's free macOS runners are scarce and often queue for a long time, so macOS runs everything above in one
    # job and is not a required check: its result shows on the pull request without blocking the merge.
    runs-on: macos-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - name: UI smoke test
        run: npm run screenshots
      - name: npm package
        run: |
          npm pack
          npm install -g --prefix "$RUNNER_TEMP/npm" ./agenttiles-*.tgz
          pkg="$RUNNER_TEMP/npm/lib/node_modules/agenttiles"
          for f in out/main/index.js out/preload/index.js out/renderer/index.html out/hook/agenttiles-hook.js out/cli/uninstall.js resources/icon.ico resources/icon.png; do
            test -f "$pkg/$f" || { echo "missing $f"; exit 1; }
          done
          test "$("$RUNNER_TEMP/npm/bin/agenttiles" --version)" = "$(node -p "require('./package.json').version")"
          export CLAUDE_CONFIG_DIR="$RUNNER_TEMP/claude"
          mkdir -p "$CLAUDE_CONFIG_DIR" && echo '{}' > "$CLAUDE_CONFIG_DIR/settings.json"
          "$RUNNER_TEMP/npm/bin/agenttiles" --uninstall
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: ui-screenshots-macOS
          path: docs/images/
          retention-days: 14
