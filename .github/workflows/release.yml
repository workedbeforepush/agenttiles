name: Release

# release-please keeps a "chore(main): release x.y.z" pull request up to date with the next version and the changelog,
# written from the conventional commit titles merged since the last release. Merging that pull request tags the
# version, creates the GitHub release, and this workflow then publishes the package to npm.
on:
  push:
    branches: [main]
  # Start by hand (Actions → Release → Run workflow), e.g. when GitHub did not deliver a push event.
  workflow_dispatch:

permissions:
  contents: read

jobs:
  release-please:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    outputs:
      release_created: ${{ steps.release.outputs.release_created }}
      tag_name: ${{ steps.release.outputs.tag_name }}
    steps:
      - uses: googleapis/release-please-action@v5
        id: release
        with:
          # A personal access token, not GITHUB_TOKEN: pull requests opened with GITHUB_TOKEN start no workflows, so
          # the required CI checks would never run on the release pull request and main's protection would block it.
          token: ${{ secrets.RELEASE_PLEASE_TOKEN }}

  publish:
    name: Publish to npm
    needs: release-please
    if: needs.release-please.outputs.release_created == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write # npm trusted publishing (OIDC) and provenance; no npm token in the repo
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ needs.release-please.outputs.tag_name }}
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
          package-manager-cache: false # never use caching in release builds
      # Trusted publishing needs npm 11.5.1 or later.
      - run: npm install -g npm@11
      - run: npm ci
        env:
          ELECTRON_SKIP_BINARY_DOWNLOAD: '1'
      # prepack builds the app.
      - run: npm publish --provenance --access public
